name: 测试并发布到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    name: 跑离线测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # 本项目零运行时依赖，无需 npm install
      - run: npm test

  deploy:
    name: 发布静态站
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # 仓库还没开过 Pages 时，由本工作流自己开通（需要 pages: write 与 id-token: write）
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: './public'
      - id: deployment
        uses: actions/deploy-pages@v4
